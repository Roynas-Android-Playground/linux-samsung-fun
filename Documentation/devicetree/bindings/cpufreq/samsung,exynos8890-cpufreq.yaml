%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/samsung,exynos8890-cpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 dual-cluster CPU frequency scaling

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  Exynos8890 CPU frequency policy coordinates the aggregate Apollo and
  Mongoose clocks, S2MPS16 voltage rails and MIF minimum-frequency constraints.
  Clock-register and EMA transactions belong to the CPU clock provider. The
  driver refuses to operate while the APM Cortex-M3 owns closed-loop DVFS.

properties:
  compatible:
    const: samsung,exynos8890-cpufreq

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: apollo
      - const: mongoose

  apollo-supply: true
  mongoose-supply: true

  samsung,pmu:
    description: Phandle to the Exynos PMU syscon used to verify APM ownership.
    $ref: /schemas/types.yaml#/definitions/phandle

  samsung,apm:
    description: Phandle to the APM ownership provider kept in direct-PMIC mode.
    $ref: /schemas/types.yaml#/definitions/phandle

  samsung,mif-devfreq:
    description: |
      Phandle to the MIF devfreq provider receiving CPU floor votes.  CPU and
      MIF tables remain in Hz; the driver converts the vote at the generic
      devfreq QoS boundary, whose frequency ABI is kHz.
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - clocks
  - clock-names
  - apollo-supply
  - mongoose-supply
  - samsung,pmu
  - samsung,apm
  - samsung,mif-devfreq

additionalProperties: false
