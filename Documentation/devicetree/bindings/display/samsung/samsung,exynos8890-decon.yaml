%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos8890-decon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 Display and Enhancement Controller

maintainers:
  - Inki Dae <inki.dae@samsung.com>
  - Seung-Woo Kim <sw0312.kim@samsung.com>

description: |
  DECON is the Exynos8890 display controller. Initial mainline support only
  observes the bootloader-configured controller state and does not yet take
  ownership of clocks, power domains, interrupts, IOMMUs, VPP channels, DSIM,
  PHY or panel hardware.

properties:
  compatible:
    const: samsung,exynos8890-decon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    display-controller@13960000 {
        compatible = "samsung,exynos8890-decon";
        reg = <0x13960000 0x10000>;
    };
