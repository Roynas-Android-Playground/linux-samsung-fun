%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos8890-decon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 DECON-F display controller

maintainers:
  - Inki Dae <inki.dae@samsung.com>
  - Seung-Woo Kim <sw0312.kim@samsung.com>

description: |
  DECON-F drives the internal panel on the DISP0 domain. It blends up to
  eight windows but owns no DMA of its own: every window sources from one of
  the VPP IDMA channels described by samsung,exynos8890-vpp, selected through
  WIN_CONTROL.CHMAP.

properties:
  compatible:
    const: samsung,exynos8890-decon-f

  reg:
    maxItems: 1

  interrupts:
    maxItems: 4

  interrupt-names:
    items:
      - const: fifo
      - const: vstatus
      - const: framedone
      - const: rsc_conflict

  clocks:
    maxItems: 6

  clock-names:
    items:
      - const: disp_pll
      - const: decon_pclk
      - const: eclk_user
      - const: eclk_leaf
      - const: vclk_user
      - const: vclk_leaf

  power-domains:
    maxItems: 1

  samsung,vpp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the samsung,exynos8890-vpp node providing this DECON's
      window DMA channels.

  pinctrl-names:
    const: default

  pinctrl-0:
    description: TE input pin, muxed into DECON's hardware trigger.

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Output to the MIPI-DSI host.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains
  - samsung,vpp
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/samsung,exynos8890-cmu.h>

    display-controller@13960000 {
        compatible = "samsung,exynos8890-decon-f";
        reg = <0x13960000 0x10000>;
        interrupts = <GIC_SPI 180 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 181 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 182 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 183 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "fifo", "vstatus", "framedone", "rsc_conflict";
        clocks = <&cmu_disp0 CLK_FOUT_DISP_PLL>,
                 <&cmu_disp0 CLK_GOUT_DISP0_PCLK_DECON0>,
                 <&cmu_disp0 CLK_MOUT_DISP0_SCLK_DISP0_DECON0_ECLK0_USER>,
                 <&cmu_disp0 CLK_DOUT_DISP0_SCLK_DECON0_ECLK0>,
                 <&cmu_disp0 CLK_MOUT_DISP0_SCLK_DISP0_DECON0_VCLK0_USER>,
                 <&cmu_disp0 CLK_DOUT_DISP0_SCLK_DECON0_VCLK0>;
        clock-names = "disp_pll", "decon_pclk", "eclk_user", "eclk_leaf",
                      "vclk_user", "vclk_leaf";
        samsung,vpp = <&vpp>;
        power-domains = <&pd_disp0>;

        port {
            decon_out_dsim: endpoint {
                remote-endpoint = <&dsim_in_decon>;
            };
        };
    };
