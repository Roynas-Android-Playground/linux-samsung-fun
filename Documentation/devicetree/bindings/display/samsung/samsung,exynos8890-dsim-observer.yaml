%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos8890-dsim-observer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 MIPI DSIM state observer

maintainers:
  - Inki Dae <inki.dae@samsung.com>
  - Seung-Woo Kim <sw0312.kim@samsung.com>

description: |
  A read-only diagnostic client for the Exynos8890 MIPI DSIM register block.
  It reports bootloader-configured link, compression, command scheduler, PLL,
  PHY and TE state without taking ownership of clocks, interrupts, power,
  PHYs, regulators, GPIOs, the MIPI host or panel hardware.

properties:
  compatible:
    const: samsung,exynos8890-dsim-observer

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    dsi-observer@13900000 {
        compatible = "samsung,exynos8890-dsim-observer";
        reg = <0x13900000 0x100>;
    };
