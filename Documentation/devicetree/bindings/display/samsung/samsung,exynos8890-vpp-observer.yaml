%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos8890-vpp-observer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 VPP state observer

maintainers:
  - Inki Dae <inki.dae@samsung.com>
  - Seung-Woo Kim <sw0312.kim@samsung.com>

description: |
  A read-only diagnostic client for an Exynos8890 VPP/IDMA register block.
  It reports the bootloader-configured source format, geometry, DMA address,
  ping-pong and real-time path state without taking ownership of clocks,
  interrupts, power domains, IOMMUs or framebuffer memory.

properties:
  compatible:
    const: samsung,exynos8890-vpp-observer

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    vpp-observer@13952000 {
        compatible = "samsung,exynos8890-vpp-observer";
        reg = <0x13952000 0x1000>;
    };
