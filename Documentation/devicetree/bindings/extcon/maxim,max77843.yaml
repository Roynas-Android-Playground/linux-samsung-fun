%YAML 1.2
---
$id: http://devicetree.org/schemas/extcon/maxim,max77843.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77843 MicroUSB and Companion Power Management IC Extcon

maintainers:
  - Chanwoo Choi <cw00.choi@samsung.com>
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  This is a part of device tree bindings for Maxim MAX77843 MicroUSB
  Integrated Circuit (MUIC).

  See also Documentation/devicetree/bindings/mfd/maxim,max77843.yaml for
  additional information and example.

properties:
  compatible:
    const: maxim,max77843-muic

  connector:
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

  maxim,afc-request-byte:
    $ref: /schemas/types.yaml#/definitions/uint8
    default: 0x46
    description: |
      The capability the MUIC asks an Adaptive Fast Charging charger for.
      Bits 7-4 select the voltage as 5V plus one volt per step, bits 3-0 the
      current as 0.75A plus 0.15A per step, so the default 0x46 requests
      9V at 1.65A. Chargers that cannot meet the request negotiate downwards.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description:
      Any connector to the data bus of this controller should be modelled using
      the OF graph bindings specified
    properties:
      port:
        $ref: /schemas/graph.yaml#/properties/port

required:
  - compatible
  - connector

additionalProperties: false
