%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/brcm,bcm4773.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM4773 GNSS and sensor-hub device

maintainers:
  - Johan Hovold <johan@kernel.org>

description: |
  The BCM4773 combines a GNSS receiver and sensor hub behind Broadcom's SSI
  protocol transported over SPI. GPIO handshake lines coordinate transfers
  between the application processor and BCM4773.

allOf:
  - $ref: gnss-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: brcm,bcm4773

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 26000000

  host-request-gpios:
    maxItems: 1
    description:
      BCM4773 HOST_REQ output. An asserted line tells the application processor
      that data is pending and is also used as the transport interrupt.

  mcu-request-gpios:
    maxItems: 1
    description:
      Application-processor request output used to wake BCM4773 before an SSI
      transaction.

  mcu-response-gpios:
    maxItems: 1
    description:
      BCM4773 response output indicating that the device is awake and ready for
      an SSI transaction.

required:
  - compatible
  - reg
  - spi-max-frequency
  - enable-gpios
  - host-request-gpios
  - mcu-request-gpios
  - mcu-response-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        gnss@0 {
            compatible = "brcm,bcm4773";
            reg = <0>;
            spi-max-frequency = <26000000>;
            spi-cpol;
            spi-cpha;

            enable-gpios = <&gpio0 1 GPIO_ACTIVE_HIGH>;
            host-request-gpios = <&gpio0 2 GPIO_ACTIVE_HIGH>;
            mcu-request-gpios = <&gpio0 3 GPIO_ACTIVE_HIGH>;
            mcu-response-gpios = <&gpio0 4 GPIO_ACTIVE_HIGH>;
        };
    };
