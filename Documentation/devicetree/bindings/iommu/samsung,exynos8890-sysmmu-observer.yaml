%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/samsung,exynos8890-sysmmu-observer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 System MMU state observer

maintainers:
  - Marek Szyprowski <m.szyprowski@samsung.com>

description: |
  A read-only diagnostic client for an Exynos8890 System MMU register block.
  It reports the bootloader-configured translation context and fault state
  without taking ownership of clocks, interrupts, power domains, IOMMU
  domains, page tables or client devices.

properties:
  compatible:
    const: samsung,exynos8890-sysmmu-observer

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    iommu-observer@13a10000 {
        compatible = "samsung,exynos8890-sysmmu-observer";
        reg = <0x13a10000 0x1000>;
    };
