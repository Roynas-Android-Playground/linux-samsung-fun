%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/maxim,max77854.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77854 notification LEDs

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  The MAX77854 companion PMIC contains four current-controlled LED outputs.
  Channel zero is a board service output on Samsung herolte. Channels one to
  three drive the red, green and blue notification LED dies.

properties:

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  compatible:
    const: maxim,max77854-led

  led@1:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        const: 1
      color:
        const: 1
      function:
        const: status
      status:
        const: okay
      max-brightness:
        minimum: 1
        maximum: 2
      retain-state-shutdown: false
    required: [reg, color, function]

  led@2:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        const: 2
      color:
        const: 2
      function:
        const: status
      status:
        const: okay
      max-brightness:
        minimum: 1
        maximum: 2
      retain-state-shutdown: false
    required: [reg, color, function]

  led@3:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        const: 3
      color:
        const: 3
      function:
        const: status
      status:
        const: okay
      max-brightness:
        minimum: 1
        maximum: 2
      retain-state-shutdown: false
    required:
      - reg
      - color
      - function

required:
  - "#address-cells"
  - "#size-cells"
  - compatible
  - led@1
  - led@2
  - led@3

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    leds {
        compatible = "maxim,max77854-led";
        #address-cells = <1>;
        #size-cells = <0>;

        led@1 {
            reg = <1>;
            color = <LED_COLOR_ID_RED>;
            function = LED_FUNCTION_STATUS;
        };

        led@2 {
            reg = <2>;
            color = <LED_COLOR_ID_GREEN>;
            function = LED_FUNCTION_STATUS;
        };

        led@3 {
            reg = <3>;
            color = <LED_COLOR_ID_BLUE>;
            function = LED_FUNCTION_STATUS;
        };
    };
