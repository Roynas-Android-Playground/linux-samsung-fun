%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/samsung,s2mpb02-torch.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPB02 torch LED

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  Low-current continuous torch operation of the primary S2MPB02 flash output.
  Flash strobe and the secondary output are outside this binding.

properties:
  compatible:
    const: samsung,s2mpb02-torch

  max-current-microamp:
    enum: [20000, 40000, 60000, 80000, 100000]
    description: Maximum continuous torch current exposed to userspace.

  torch-enable-gpios:
    maxItems: 1
    description: External active-high torch input held low during I2C control.

required:
  - compatible
  - max-current-microamp
  - torch-enable-gpios

additionalProperties: false
