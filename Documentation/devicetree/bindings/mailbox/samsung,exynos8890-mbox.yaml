%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/samsung,exynos8890-mbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 AP to CP mailbox controller

maintainers:
  - Samsung SoC Team <linux-samsung-soc@vger.kernel.org>

description: |
  Exynos8890 provides sixteen bidirectional interrupt bits and 64 shared
  32-bit registers for communication between the application processor and
  the cellular processor. Each mailbox specifier selects one interrupt bit.

properties:
  compatible:
    items:
      - const: samsung,exynos8890-mbox
      - const: syscon

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#mbox-cells':
    const: 1

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - '#mbox-cells'

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mailbox@10540000 {
        compatible = "samsung,exynos8890-mbox", "syscon";
        reg = <0x10540000 0x180>;
        interrupts = <GIC_SPI 338 IRQ_TYPE_LEVEL_HIGH>;
        #mbox-cells = <1>;
    };
