%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/samsung,exynos8890-mbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 MCU IPC mailbox

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  The MCU IPC block connects the application processor and communication
  processor with sixteen doorbells in each direction and 64 shared 32-bit
  ISSR words. Incoming doorbells occupy bits 16 through 31 of the receive
  status, clear and mask registers. Outgoing doorbells occupy bits 0 through
  15 of the transmit generation register. Channel numbers identify physical
  doorbell bits, rather than message payloads. The syscon interface provides
  access to the shared words at register offsets 0x80 through 0x17c.

properties:
  compatible:
    items:
      - const: samsung,exynos8890-mbox
      - const: syscon

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Combined incoming-doorbell interrupt.

  '#mbox-cells':
    const: 1
    description: Doorbell channel number, from 0 to 15.

required:
  - compatible
  - reg
  - interrupts
  - '#mbox-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mailbox@10540000 {
        compatible = "samsung,exynos8890-mbox", "syscon";
        reg = <0x10540000 0x180>;
        interrupts = <GIC_SPI 338 IRQ_TYPE_LEVEL_HIGH>;
        #mbox-cells = <1>;
    };
