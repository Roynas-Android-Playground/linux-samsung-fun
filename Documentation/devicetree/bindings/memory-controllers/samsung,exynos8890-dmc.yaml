%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/samsung,exynos8890-dmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 Dynamic Memory Controller

maintainers:
  - Ivaylo Ivanov <ivo.ivanov.ivanov1@gmail.com>

description: |
  The Exynos8890 MIF frequency transaction spans four SMC/DREX channels,
  four LPDDR4 PHYs, the shared MIF PLL, CCORE clocks and PSCDC.  This node is
  the sole functional owner of those fields and of the vdd_mif rail while a
  frequency transition is in progress.

properties:
  compatible:
    const: samsung,exynos8890-dmc

  reg:
    minItems: 20
    maxItems: 20

  reg-names:
    items:
      - const: dmc-misc-ccore
      - const: cmu-top
      - const: cmu-ccore
      - const: pmu-alive
      - const: cmu-mif0
      - const: cmu-mif1
      - const: cmu-mif2
      - const: cmu-mif3
      - const: smc0
      - const: smc1
      - const: smc2
      - const: smc3
      - const: phy0
      - const: phy1
      - const: phy2
      - const: phy3
      - const: dmc-misc0
      - const: dmc-misc1
      - const: dmc-misc2
      - const: dmc-misc3

  clocks:
    minItems: 3
    maxItems: 3

  clock-names:
    items:
      - const: bus0-pll
      - const: bus3-pll
      - const: switch-gate

  vdd-supply:
    description: |
      S2MPS16 Buck1 regulator for the vdd_mif memory-interface rail. The DMC
      transaction uses the regulator driver's typed VTH-offset operation at
      the characterized 1.539 GHz crossing.

  samsung,apm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: APM ownership provider which holds firmware DVFS off.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - vdd-supply
  - samsung,apm

additionalProperties: false

examples:
  - |
    memory-controller@10520000 {
        compatible = "samsung,exynos8890-dmc";
        reg = <0x10520000 0x10000>, <0x10570000 0x8000>,
              <0x105b0000 0x8000>, <0x105c0000 0x10000>,
              <0x10850000 0x8000>, <0x10950000 0x8000>,
              <0x10a50000 0x8000>, <0x10b50000 0x8000>,
              <0x10800000 0x10000>, <0x10900000 0x10000>,
              <0x10a00000 0x10000>, <0x10b00000 0x10000>,
              <0x10820000 0x10000>, <0x10920000 0x10000>,
              <0x10a20000 0x10000>, <0x10b20000 0x10000>,
              <0x10890000 0x1000>, <0x10990000 0x1000>,
              <0x10a90000 0x1000>, <0x10b90000 0x1000>;
        reg-names = "dmc-misc-ccore", "cmu-top", "cmu-ccore",
                    "pmu-alive", "cmu-mif0", "cmu-mif1", "cmu-mif2",
                    "cmu-mif3", "smc0", "smc1", "smc2", "smc3",
                    "phy0", "phy1", "phy2", "phy3", "dmc-misc0",
                    "dmc-misc1", "dmc-misc2", "dmc-misc3";
        clocks = <&cmu_top 215>, <&cmu_top 218>, <&cmu_top 402>;
        clock-names = "bus0-pll", "bus3-pll", "switch-gate";
        samsung,apm = <&apm>;
        vdd-supply = <&buck1>;
    };
