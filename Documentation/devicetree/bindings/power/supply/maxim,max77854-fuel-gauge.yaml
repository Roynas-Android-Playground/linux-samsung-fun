%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max77854-fuel-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77854 fuel gauge

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  The MAX77854 companion PMIC contains a MAX1704x-derived fuel-gauge block
  accessed through an internal secondary I2C address. The parent MFD creates
  the secondary client, so the child node has no reg property.

properties:
  compatible:
    const: maxim,max77854-fuel-gauge

required:
  - compatible

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@66 {
            compatible = "maxim,max77854";
            reg = <0x66>;

            fuel-gauge {
                compatible = "maxim,max77854-fuel-gauge";
            };
        };
    };
