%YAML 1.2
---
$id: http://devicetree.org/schemas/reserved-memory/samsung,exynos8890-modem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 cellular modem memory

maintainers:
  - Samsung SoC Team <linux-samsung-soc@vger.kernel.org>

allOf:
  - $ref: reserved-memory.yaml

properties:
  compatible:
    const: exynos,modem_if

  reg:
    items:
      - description: 136 MiB CP boot and IPC memory

  no-map: true

required:
  - compatible
  - reg
  - no-map

unevaluatedProperties: false
