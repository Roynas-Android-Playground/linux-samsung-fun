%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/samsung/samsung,exynos8890-apm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8890 APM DVFS ownership controller

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description:
  The Exynos8890 APM Cortex-M3 can run firmware that controls DVFS through a
  mailbox. When Linux owns native clock and regulator transitions, this node
  binds the provider that keeps the APM powered down and proves exclusive
  ownership through the PMU system controller. The node is normally a child
  of that controller. The samsung,pmu phandle is a compatibility fallback for
  a standalone node.

properties:
  compatible:
    const: samsung,exynos8890-apm

  samsung,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the Exynos8890 PMU system controller.

required:
  - compatible

additionalProperties: false

examples:
  - |
    pmu_system_controller: system-controller@105c0000 {
        compatible = "samsung,exynos8890-pmu", "samsung,exynos7-pmu", "syscon";
        reg = <0x105c0000 0x10000>;

        apm {
            compatible = "samsung,exynos8890-apm";
        };
    };
...
