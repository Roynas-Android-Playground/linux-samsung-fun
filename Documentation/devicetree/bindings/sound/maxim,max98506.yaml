%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/maxim,max98506.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX98506 speaker amplifier

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  The MAX98506 is a mono class-D speaker amplifier with an I2S input and
  integrated boost converter. The initial binding describes only the control
  bus and audio DAI; board-specific supplies and interrupt wiring must not be
  invented when they are not present in the hardware description.

properties:
  compatible:
    const: maxim,max98506

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@31 {
            compatible = "maxim,max98506";
            reg = <0x31>;
            #sound-dai-cells = <0>;
        };
    };
